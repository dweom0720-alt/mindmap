<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#13274A">
<title>마인드맵</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<!-- 홈 -->
<section id="home" class="view">
  <header class="home-head">
    <div class="home-row">
      <div>
        <div class="eyebrow">MIND MAP</div>
        <h1>내 마인드맵</h1>
      </div>
      <button class="icon-btn on-dark" id="homeMenuBtn" aria-label="메뉴">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="마인드맵, 가지 내용 검색" aria-label="검색">
    </label>
    <button class="sync" id="syncLine"><span class="dot"></span><span id="syncText">이 기기에 자동 저장됨</span></button>
  </header>
  <div class="home-actions">
    <button class="btn-primary" id="newMapBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>새 마인드맵</span>
    </button>
    <button class="btn-outline" id="aiMakeBtn">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span>AI로 만들기</span>
    </button>
  </div>
  <div class="home-actions one">
    <button class="btn-text gold-text" id="pasteMapBtn">
      <svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg><span>글을 붙여넣어 만들기</span>
    </button>
  </div>
  <nav class="tabs" id="catTabs"></nav>
  <div class="map-list" id="mapList"></div>
</section>

<!-- 편집 -->
<section id="editor" class="view" hidden>
  <header class="ed-head">
    <div class="ed-row">
      <button class="icon-btn" id="backBtn" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="ed-title" id="titleBtn"></button>
      <button class="icon-btn" id="undoBtn" aria-label="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="icon-btn" id="redoBtn" aria-label="다시 실행"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="icon-btn" id="multiBtn" aria-label="여러 개 선택"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/><path d="m5 7 1.5 1.5L9 6"/><path d="m15 17 1.5 1.5L19 16"/></svg></button>
      <button class="icon-btn" id="styleBtn" aria-label="맵 스타일"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-1.1-1-1.5-1-2.6 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg></button>
      <button class="icon-btn" id="edMenuBtn" aria-label="더보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
    <nav class="layout-tabs" id="layoutTabs"></nav>
  </header>

  <div class="ed-body">
    <aside class="outline" id="outline" aria-label="개요"></aside>
    <div class="stage" id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
      <div class="pill" id="pill" hidden>
        <button data-act="child" aria-label="하위 가지"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>하위</span></button>
        <button data-act="sibling" aria-label="형제 가지"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 17h14M12 12h7"/></svg><span>형제</span></button>
        <button data-act="edit" aria-label="글 수정"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>수정</span></button>
        <button data-act="props" aria-label="꾸미기"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-1.1-1-1.5-1-2.6 0-1.1.9-2 2-2h2.4A5.6 5.6 0 0 0 22 9.8C22 5.5 17.5 2 12 2z"/></svg><span>꾸미기</span></button>
        <button data-act="more" aria-label="더보기"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span>더보기</span></button>
        <button data-act="delete" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>삭제</span></button>
      </div>
      <div class="voice-bar" id="voiceBar" hidden>
        <span class="voice-dot"></span><span id="voiceText">듣는 중…</span>
        <button id="voiceStop">끝내기</button>
      </div>
      <button class="note-peek" id="notePeek" hidden></button>
      <div class="multi-bar" id="multiBar" hidden>
        <span id="multiCount"></span>
        <button data-mb="style">꾸미기</button>
        <button data-mb="same">크기 같게</button>
        <button data-mb="auto">자동 크기</button>
        <button data-mb="all">전체</button>
        <button data-mb="del" class="danger">삭제</button>
        <button data-mb="done" class="done">완료</button>
      </div>
      <textarea id="editInput" class="edit-input" hidden rows="1" spellcheck="false"></textarea>
      <div class="ghost" id="ghost" hidden></div>
      <div class="bottom-bar">
        <button class="round-btn" id="fitBtn" aria-label="화면에 맞추기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="fab" id="fab" aria-label="가지 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="round-btn gold" id="aiBtn" aria-label="AI 도우미"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></button>
      </div>
    </div>
  </div>
</section>

<!-- 시트 (꾸미기, 메뉴) -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>

<!-- 입력/확인 대화상자 -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <p id="dlgMsg"></p>
    <input id="dlgInput" type="text">
    <div class="dlg-actions">
      <button value="cancel" class="btn-text">취소</button>
      <button value="ok" class="btn-primary small" id="dlgOk">확인</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<input type="file" id="imgInput" accept="image/*" hidden>

<script src="app.js?v=9"></script>
<script src="ai.js?v=9"></script>
<script src="sync.js?v=9"></script>
</body>
</html>
